<style>
/* Layout: terminal financiera. Panel lateral en escritorio, barra inferior en móvil; KPIs grandes en USD arriba, detalle abajo. */
:root{
 --bg:#0a0f1a;--panel:#0f1726;--panel2:#141e31;--line:#1d2940;--line2:#27364f;
 --fg:#e6ebf4;--mut:#8b98ae;--dim:#5f6c83;
 --acc:#4f8cff;--acc-s:rgba(79,140,255,.14);
 --up:#2ecc7a;--up-s:rgba(46,204,122,.13);--dn:#ff5d6c;--dn-s:rgba(255,93,108,.13);--warn:#f4b23e;--warn-s:rgba(244,178,62,.14);
 --rf:#3987e5;--rv:#d95926;--es:#199e70;--cr:#c98500;--lq:#8b98ae;
 --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#0ca30c;--c7:#9085e9;--c8:#e66767;--c9:#9085e9;--c10:#c98500;--c11:#199e70;--c12:#d95926;
 --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
 --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
 --r:12px;
 color-scheme:dark;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
 --bg:#f3f5f9;--panel:#ffffff;--panel2:#f6f8fb;--line:#e2e7ef;--line2:#d3dae6;--fg:#0f172a;--mut:#5b677c;--dim:#8a95a8;
 --acc:#2563eb;--acc-s:rgba(37,99,235,.1);--up:#0f9d58;--up-s:rgba(15,157,88,.1);--dn:#dc2f45;--dn-s:rgba(220,47,69,.09);--warn:#b7791f;--warn-s:rgba(183,121,31,.12);
 --rf:#2a78d6;--rv:#eb6834;--es:#1baf7a;--cr:#eda100;--lq:#64748b;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948;--c9:#6250d6;--c10:#eda100;--c11:#1baf7a;--c12:#eb6834;color-scheme:light}}
:root[data-theme="light"]{
 --bg:#f3f5f9;--panel:#ffffff;--panel2:#f6f8fb;--line:#e2e7ef;--line2:#d3dae6;--fg:#0f172a;--mut:#5b677c;--dim:#8a95a8;
 --acc:#2563eb;--acc-s:rgba(37,99,235,.1);--up:#0f9d58;--up-s:rgba(15,157,88,.1);--dn:#dc2f45;--dn-s:rgba(220,47,69,.09);--warn:#b7791f;--warn-s:rgba(183,121,31,.12);
 --rf:#2a78d6;--rv:#eb6834;--es:#1baf7a;--cr:#eda100;--lq:#64748b;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948;--c9:#6250d6;--c10:#eda100;--c11:#1baf7a;--c12:#eb6834;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
.hb2{display:grid;gap:11px}.hb2t{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:5px}.hb2t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb2t b{font:600 12px var(--mono);color:var(--mut);white-space:nowrap}
.hb2 .tr{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}.hb2 .tr i{display:block;height:100%;border-radius:4px}
.catr{display:flex;gap:8px;align-items:center;margin-top:8px}.catr .inp{flex:1;min-width:0}.catr .btn{flex:none}
.addm{margin-left:10px;font:700 10.5px var(--mono);color:var(--acc);border:1px solid var(--line2);border-radius:6px;padding:2px 7px;letter-spacing:.04em}
.sheet select.inp{font-size:15px}
.prev{margin-top:10px;border:1px solid var(--line2);border-radius:10px;padding:8px 12px;background:var(--bg);display:grid;gap:4px;font:500 13px var(--mono)}
.prev:empty{display:none}.prev .pr1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.prev .pr1>span:first-child{color:var(--mut);font-family:var(--sans)}.prev .pr1.s{opacity:.85}
.prev .prw{color:var(--dn);font:600 12.5px var(--sans);margin-top:2px}
#lock{position:fixed;inset:0;z-index:120;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.locked body>.wrap,.locked #nav{visibility:hidden}
.lkbox{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:320px;color:var(--fg)}
.lkbox svg{color:var(--acc)}.lkbox h2{margin:6px 0 0;font-size:22px}.lkbox p{margin:0;color:var(--mut);font-size:14px}
.lkbtn{margin-top:14px;background:var(--acc);color:#fff;padding:14px 20px;border-radius:12px;font-weight:600;width:100%;text-align:center}
.lkm{min-height:1.4em;font-size:13px!important;color:var(--warn)!important}.lklink{color:var(--mut);font-size:13px;margin-top:8px;text-decoration:underline}
.dcards .kpi .s{margin-top:8px}
@media(max-width:699px){.dcards{grid-template-columns:minmax(0,1fr)!important;gap:8px}.dcards .card{padding:10px 12px}.dcards .dq{margin-top:6px;gap:6px}.dcards .dq button{padding:6px 9px;flex-direction:row;align-items:baseline;justify-content:space-between}.dcards .dq b{font-size:16px}.dcards .kpi .s{margin-top:5px;font-size:11.5px}.dcards .dq .src{position:static;margin-left:4px}}
.dq{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.dq button{border:1px solid var(--line2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;position:relative}
.dq button:hover{border-color:var(--acc)}
.dq small{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.dq b{font:700 20px var(--mono);letter-spacing:-.02em}
.dq .src{position:absolute;top:6px;right:6px}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px;cursor:pointer}
.arbt td,.arbt th{text-align:center!important;padding:10px 8px}.arbt td:first-child,.arbt th:first-child{text-align:left!important}
.steps{margin:0;padding-left:20px;display:grid;gap:12px;line-height:1.55}
.steps a{color:var(--acc)}
.code{background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:10px;font:500 11.5px/1.5 var(--mono);overflow-x:auto;white-space:pre;margin:8px 0}
.lab{display:block;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 0 5px}
.inp{width:100%;font:500 15px var(--mono);padding:11px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);color:var(--fg)}
.inp:focus{outline:0;border-color:var(--acc)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--panel2);border:1px solid var(--line2);color:var(--fg);padding:10px 14px;border-radius:10px;font-size:13px;max-width:min(92vw,520px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
@media(min-width:900px){.toast{bottom:24px;left:calc(50% + 116px)}}
.srl{max-height:46vh;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px}
.mgrid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1000px){.mgrid{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.mside{display:grid;gap:12px;align-content:start;min-width:0}
.mth,.mrw{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(64px,.9fr) minmax(70px,.9fr) minmax(52px,.6fr) 72px;gap:8px;align-items:center;padding:9px 14px;width:100%}
.mth{font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line)}
.mth span:not(:first-child),.mrw>span:not(.mi){text-align:right}
.mrw{border-top:1px solid var(--line);font-size:13px}
.mgh+.mrw{border-top:0}
.mrw:hover{background:var(--panel2)}.mrw.on{background:var(--acc-s)}
.mrw .mi{min-width:0}.mrw .mi b{font:700 13px var(--mono);display:block}.mrw .mi small{font-size:11.5px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrw .msp{display:flex;justify-content:flex-end}
.mgh{padding:8px 14px;background:var(--panel2);font:700 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--acc);border-top:1px solid var(--line)}
@media(max-width:520px){.mth,.mrw{grid-template-columns:minmax(0,1.3fr) minmax(60px,.9fr) minmax(66px,.9fr);padding:9px 12px}.mth span:nth-child(n+4),.mrw>span:nth-child(n+4){display:none}}
.mbig .mbh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mbig .mbp{font:700 28px var(--mono);letter-spacing:-.03em;margin:6px 0 8px}
.eds{padding:12px 14px;display:grid;gap:12px}
.et{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--sans);font-feature-settings:"tnum"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
@media(min-width:900px){.wrap{padding-left:calc(232px + 28px);padding-right:28px;max-width:1320px;padding-block:0 48px}}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ttl{min-width:0}
.eyebrow{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
h1{font-size:24px;line-height:1.15;margin:4px 0 0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.hright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.yr{display:flex;align-items:center;gap:2px;border:1px solid var(--line2);border-radius:10px;padding:2px}
.yr span{font:600 14px var(--mono);min-width:48px;text-align:center}
.yr button{width:30px;height:30px;border-radius:8px;font-size:17px;color:var(--mut);display:grid;place-items:center}
.yr button:hover{background:var(--panel2);color:var(--fg)}
.yr button:disabled{opacity:.25}
.fx{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:10px;padding:6px 10px;font:500 12px var(--mono);color:var(--mut)}
.fx b{color:var(--fg);font-weight:700;font-size:13px}
.fx:hover{border-color:var(--acc)}
.fx.on{color:var(--acc);border-color:var(--acc);background:var(--acc-s)}
.stx{display:flex;align-items:center;gap:7px;margin-top:6px;font:500 11.5px var(--mono);color:var(--dim)}
.stx i{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.stx.ok i{background:var(--up);box-shadow:0 0 0 3px var(--up-s)}
.stx.bad{color:var(--warn)}.stx.bad i{background:var(--warn)}
.seg{display:flex;border:1px solid var(--line2);border-radius:10px;padding:2px;margin-top:12px;max-width:420px}
.seg button{flex:1;padding:7px 0;border-radius:8px;font-size:13px;font-weight:600;color:var(--mut);text-align:center}
.seg button.on{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}

/* nav */
#nav{position:fixed;z-index:25;background:var(--panel);display:flex}
#nav .brand{display:none}
#nav button{display:flex;align-items:center;gap:10px;color:var(--mut);font-weight:600;font-size:11px;border-radius:10px}
#nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#nav button.on{color:var(--acc)}
@media(max-width:899px){
 #nav button{font-size:12px;letter-spacing:0}
 #nav svg{width:25px;height:25px}
 #nav{inset:auto 0 0 0;border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
 #nav button{flex:1;flex-direction:column;gap:4px;padding:8px 0 6px}
}
@media(min-width:900px){
 #nav{inset:0 auto 0 0;width:232px;flex-direction:column;gap:2px;border-right:1px solid var(--line);padding:calc(20px + env(safe-area-inset-top,0px)) 14px 20px max(14px,env(safe-area-inset-left,0px))}
 #nav .brand{display:block;padding:4px 10px 22px}
 #nav .brand b{display:block;font-size:16px;letter-spacing:-.01em}
 #nav .brand span{font:500 11px var(--mono);color:var(--dim)}
 #nav button{font-size:14px;padding:10px 12px}
 #nav button:hover{background:var(--panel2);color:var(--fg)}
 #nav button.on{background:var(--acc-s);color:var(--acc)}
}

/* building blocks */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
.g5{grid-template-columns:repeat(2,minmax(0,1fr))}
.g2c{grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.g2c{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:699px){.g3>:nth-child(odd):last-child,.g5>:nth-child(odd):last-child{grid-column:1/-1}}
@media(min-width:700px){.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1100px){.g5{grid-template-columns:repeat(5,minmax(0,1fr))}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.kpi .k{font:600 11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:7px;justify-content:space-between}
.kpi .v{font:700 26px/1.1 var(--mono);letter-spacing:-.03em;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font:500 12.5px var(--mono);color:var(--mut);margin-top:6px}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,var(--acc-s),transparent 55%);pointer-events:none}
.hero>*{position:relative}
.hero .k{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.hero .big{font:700 clamp(34px,8vw,52px)/1.05 var(--mono);letter-spacing:-.04em;margin:10px 0 6px}
.hero .big small{font-size:.45em;color:var(--mut);font-weight:500;margin-right:6px;letter-spacing:0}
.hero .s{font:500 14px var(--mono);color:var(--mut)}
.hrow2{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font:700 12px var(--mono);padding:3px 8px;border-radius:7px;white-space:nowrap}
.pill.up{background:var(--up-s);color:var(--up)}.pill.dn{background:var(--dn-s);color:var(--dn)}.pill.nt{background:var(--panel2);color:var(--mut);box-shadow:inset 0 0 0 1px var(--line2)}.pill.wr{background:var(--warn-s);color:var(--warn)}
.up{color:var(--up)}.dn{color:var(--dn)}.pos{color:var(--up)}.neg{color:var(--dn)}.mutc{color:var(--mut)}
.sec{margin-top:26px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 2px 10px}
.sh h2{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.sh .m{font:500 12px var(--mono);color:var(--mut);white-space:nowrap}
@media(max-width:699px){.sh{flex-wrap:wrap}.sh .m{white-space:normal}}
.tag{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 5px;border-radius:6px;font:700 10.5px var(--mono);letter-spacing:.04em;background:var(--panel2);color:var(--ac,var(--acc));box-shadow:inset 0 0 0 1px var(--line2)}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin-top:16px}
.stack i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font:500 12px var(--mono);color:var(--mut);margin-top:10px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.bar{height:6px;border-radius:3px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--acc)}
.gauge{position:relative;height:10px;border-radius:6px;margin:16px 0 8px;background:linear-gradient(90deg,var(--up),var(--c4) 50%,var(--dn))}
.gauge i{position:absolute;top:-5px;width:4px;height:20px;margin-left:-2px;border-radius:2px;background:var(--fg);box-shadow:0 0 0 2px var(--panel)}
.gl3{display:flex;justify-content:space-between;font:500 11.5px/1.4 var(--mono);color:var(--mut)}.gl3 span:nth-child(2){text-align:center}.gl3 span:last-child{text-align:right}.gl3 b{color:var(--fg);font-weight:600}
@media(max-width:699px){#tabs button{font-size:12px}}
.note{font-size:12.5px;color:var(--mut);margin-top:12px;line-height:1.5;max-width:75ch}
.btn{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--mono);color:var(--acc);border:1px solid var(--line2);padding:6px 10px;border-radius:8px}
.btn:hover{border-color:var(--acc);background:var(--acc-s)}
.empty{text-align:center;padding:60px 10px;color:var(--mut)}
.empty button{margin-top:16px;background:var(--acc);color:#fff;padding:12px 20px;border-radius:10px;font-weight:600}

/* class tiles */
.ct{border-top:3px solid var(--cc)}
.ct .k .sw{background:var(--cc)}
.ct .v{font-size:22px}

/* holdings */
.grp{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:12px}
.gh{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--panel2);border-bottom:1px solid var(--line);font-weight:700;width:100%;text-align:left;color:var(--fg);font-size:14px}.grp.closed .gh{border-bottom:0}.grp.closed .gch{transform:rotate(-90deg)}.ghn{display:flex;flex-direction:column;min-width:0}.ghn small{font:500 11.5px var(--mono);color:var(--mut)}
.gh .sw{background:var(--cc)}
.gh .gv{margin-left:auto;font:700 14px var(--mono)}
.gh .gp{font:500 12px var(--mono);color:var(--mut);min-width:48px;text-align:right}
.hr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;width:100%;padding:11px 14px;border-top:1px solid var(--line);align-items:center}
.gh+.hr,.thd+.hr{border-top:0}
button.hr:hover{background:var(--panel2)}

.cs1.on{border-color:var(--acc);background:var(--acc-s);box-shadow:inset 0 1px 0 var(--glt)}

.ctag{font:600 9.5px var(--mono);font-style:normal;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);background:var(--acc-s);padding:1px 6px;border-radius:6px;margin-left:4px}.coff b,.coff>span{text-decoration:line-through;opacity:.55}.coff small{text-decoration:none}
.msec{margin-top:20px}.msh{display:flex;align-items:center;gap:12px;width:100%;padding:6px 4px 10px;text-align:left;color:var(--fg)}

tr.ss td{font-size:11.5px}tr.ss.in td{color:var(--up)}tr.ss.eg td{color:var(--c2)}
.gok{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;margin-left:7px;vertical-align:2px;color:#fff}.gok.in{background:var(--up)}.gok.eg{background:var(--dn)}.gn b{display:flex;align-items:center;min-width:0}.gnt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.gok{flex:none}.gsh .gv{flex:0 1 auto;min-width:0}.gsh .gv small,.gsh .gv b{overflow:hidden;text-overflow:ellipsis;max-width:100%}

<script>
const MES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MESL=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const SEC={in:'Ingresos',cr:'Créditos',gv:'Gastos varios',sm:'San Matías',ef:'Efectivo',tc:'Tarjetas',iv:'Inversiones',ot:'Otros gastos'};
const SAC={in:'var(--up)',cr:'var(--c12)',gv:'var(--c1)',sm:'var(--c3)',ef:'var(--c6)',tc:'var(--c2)',iv:'var(--c8)',ot:'var(--c4)'};
const $=s=>document.querySelector(s);
const nf=new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});
const money=n=>HIDE?'$ •••••':nf.format(Math.round(n));
const short=n=>{if(HIDE)return '•••';const a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(1).replace('.',',')+'M':a>=1e3?Math.round(n/1e3)+'k':String(Math.round(n))};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='gastos-v1',QK='gastos-q';
const now=new Date();
let S=null,yr=now.getFullYear(),mo=now.getMonth(),tab='mes',dbDoc=null,tm=null,sh=null,mfn=null;
let sec='i',cy=0,cm='all',cr=0,xp={},Q=null,SYNC='wait';
try{const v=localStorage.getItem('gastos-sec');if(v)sec=v}catch(e){}
const R=()=>S.y[yr];
const TODAY=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})();
const fd=s=>s.slice(8)+'/'+s.slice(5,7)+'/'+s.slice(0,4);
const fds=s=>s.slice(8)+'/'+s.slice(5,7)+'/'+s.slice(2,4);
const nfu=new Intl.NumberFormat('es-AR',{maximumFractionDigits:0});
let HIDE=false;try{HIDE=localStorage.getItem('fin-hide')=='1'}catch(e){}
const MASK='•••••',HV=s=>HIDE?MASK:s;
const usd=n=>'US$ '+(HIDE?MASK:nfu.format(Math.round(n)));
const usd2=n=>HIDE?'US$ '+MASK:'US$ '+n.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const usdS=n=>{if(HIDE)return 'US$ '+MASK;const a=Math.abs(n);return (n<0?'−':'')+(a>=1e6?'US$ '+(a/1e6).toFixed(2).replace('.',',')+'M':a>=1e4?'US$ '+(a/1e3).toFixed(1).replace('.',',')+'k':'US$ '+nfu.format(Math.round(a)))};
const pct=(n,d=1)=>(n>0?'+':n<0?'−':'')+Math.abs(n).toFixed(d).replace('.',',')+'%';
const pc0=n=>n.toFixed(1).replace('.',',')+'%';
const sgn=n=>n>0.0001?'up':n<-0.0001?'dn':'nt';
const none=m=>'<div class="empty">'+m+'</div>';
const hhmm=ms=>{const d=new Date(ms);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function parse(t){t=String(t).replace(/[\s$]/g,'').replace(/^US/,'');if(!t)return 0;if(t.includes(','))t=t.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');const n=parseFloat(t);return isFinite(n)?n:0}

/* ---------- gastos ---------- */
function tot(m,y=yr){let i=0,id=0,e=0,ed=0,pend=0,n=0;for(const x of S.y[y]){const a=x.a[m]||0,d=x.p[m];if(a>0){n++;if(!d)pend++}if(x.s=='in'){i+=a;if(d)id+=a}else{e+=a;if(d)ed+=a}}return{i,id,e,ed,pend,n}}
function bal(m,y=yr){let o=S.o[y]||0,real=o,est=o;for(let k=0;k<=m;k++){const t=tot(k,y);est+=t.i-t.e;real+=t.id-t.ed}return{real,est}}
function ensure(y){if(S.y[y])return;const ks=Object.keys(S.y).map(Number).sort();const pk=S.y[y-1]?y-1:ks[ks.length-1];S.y[y]=(S.y[pk]||[]).filter(x=>x.end==null&&x.rep!==false).map(x=>({s:x.s,n:x.n,a:x.rep?Array(12).fill([...x.a].reverse().find(v=>v)||0):x.a.slice(),p:Array(12).fill(0),...(x.rep?{rep:true}:{})}));S.o[y]=S.y[y-1]?Math.round(bal(11,y-1).est):0}


/* ---------- categorías de gastos e ingresos ---------- */
const CAT_DEF=[{id:'cre',n:'Créditos',t:'g'},{id:'sm352',n:'Mantenimiento San Matías 352',t:'g'},{id:'auto',n:'Auto',t:'g'},{id:'chicos',n:'Chicos: colegio y actividades',t:'g'},{id:'salud',n:'Salud y familia',t:'g'},{id:'tc',n:'Tarjetas',t:'g'},{id:'efe',n:'Efectivo y gastos personales',t:'g'},{id:'aho',n:'Ahorro e inversión',t:'a'},
 {id:'sue',n:'Sueldo',t:'i'},{id:'ren',n:'Renta',t:'i'},{id:'ext',n:'Extraordinarios',t:'i'},{id:'uso',n:'Uso de ahorros',t:'u'}];
const CAT_T={g:'Gasto',a:'Ahorro',i:'Ingreso',u:'Uso de ahorros'};
const CAT_NAME={'Sueldo Gonza':'sue','SAC':'sue','Ingreso Especial':'ext','Dividendo RSU XOM':'ren','Alquiler Depto PACHECO':'ren','Venta Moneda Extranjera':'uso','Rescate COCOS':'uso',
 'Expensas Naudir':'sm352','Celulares':'sm352','Cuota Northfield Mandy':'chicos','Cuota taller de juego Gaspar':'chicos','Deportes Mandy':'chicos','Patente Auto':'auto','OSDIPP Omar y Nancy':'salud','Gastos varios para casa':'sm352'};
const CAT_SEC={in:'ext',cr:'cre',gv:'efe',sm:'sm352',ef:'efe',tc:'tc',iv:'aho',ot:'efe'};
const cats=()=>{if(!S.cats)S.cats=JSON.parse(JSON.stringify(CAT_DEF));return S.cats};
const catById=id=>cats().find(c=>c.id==id);
function catOf(x){const c=(x.c&&catById(x.c))||catById(CAT_NAME[x.n])||catById(CAT_SEC[x.s]);return c||{id:'_',n:'Sin categoría',t:x.s=='in'?'i':'g'}}
const catOk=(c,isIn)=>isIn?(c.t=='i'||c.t=='u'):(c.t=='g'||c.t=='a');
function catColor(c){if(c.t=='a')return'var(--lq)';if(c.t=='u')return'var(--dim)';const L=cats().filter(z=>z.t==c.t);const i=L.findIndex(z=>z.id==c.id);return i<0?'var(--lq)':SER[i%SER.length]}
function catSelect(x,isIn){const cur=x?catOf(x).id:catById(CAT_SEC[sh.k])?CAT_SEC[sh.k]:'';const L=cats().filter(c=>catOk(c,isIn));
 return `<label for="scat">Categoría</label><select class="inp" id="scat">${L.map(c=>`<option value="${c.id}"${c.id==cur?' selected':''}>${esc(c.n)}</option>`).join('')}<option value="__new">+ Nueva categoría…</option></select><input type="text" id="scatn" placeholder="Nombre de la nueva categoría" hidden style="margin-top:8px">`}
document.addEventListener('change',e=>{if(e.target&&e.target.id=='scat'){const n=$('#scatn');if(n){n.hidden=e.target.value!='__new';if(!n.hidden)n.focus()}}});
function applyCat(x,isIn){const sel=$('#scat');if(!sel)return;let id=sel.value;
 if(id=='__new'){const nm=($('#scatn').value||'').trim();if(!nm)return;id='c'+Date.now().toString(36);cats().push({id,n:nm,t:isIn?'i':'g'})}
 x.c=id;Object.keys(S.y).forEach(y=>S.y[y].forEach(r=>{if(r!==x&&r.s==x.s&&r.n==x.n)r.c=id}))}
function openCats(){const L=cats();
 const row=c=>`<div class="catr"><input class="inp" type="text" data-cid="${c.id}" value="${esc(c.n)}" aria-label="Nombre"><span class="pill nt">${CAT_T[c.t]}</span><button class="btn" data-catdel="${c.id}" aria-label="Eliminar ${esc(c.n)}">✕</button></div>`;
 $('#ov').innerHTML=`<div class="ov" data-close="1"><div class="sheet" role="dialog" aria-modal="true" style="max-height:88vh;overflow:auto"><h2>Categorías</h2><div class="m">Renombrá, eliminá o agregá. Al eliminar una, sus conceptos vuelven a la categoría sugerida.</div>
 <div class="lab">Gastos y ahorro</div>${L.filter(c=>c.t=='g'||c.t=='a').map(row).join('')}
 <div class="lab">Ingresos</div>${L.filter(c=>c.t=='i'||c.t=='u').map(row).join('')}
 <div class="lab">Nueva categoría</div><div class="catr"><input class="inp" type="text" id="catnn" placeholder="Nombre"><select class="inp" id="catnt" style="max-width:150px"><option value="g">Gasto</option><option value="a">Ahorro</option><option value="i">Ingreso</option><option value="u">Uso de ahorros</option></select></div>
 <div class="btns"><button data-close="1">Cancelar</button><button class="pr" data-catsave="1">Guardar</button></div></div></div>`}
function saveCats(){const L=cats();document.querySelectorAll('#ov [data-cid]').forEach(i=>{const c=L.find(z=>z.id==i.dataset.cid);if(c&&i.value.trim())c.n=i.value.trim()});
 const nn=($('#catnn').value||'').trim();if(nn)L.push({id:'c'+Date.now().toString(36),n:nn,t:$('#catnt').value});closeSheet();save();render()}
function delCat(id,btn){if(!btn.dataset.arm){btn.dataset.arm=1;btn.textContent='¿Seguro?';return}
 S.cats=cats().filter(c=>c.id!=id);Object.keys(S.y).forEach(y=>S.y[y].forEach(r=>{if(r.c==id)delete r.c}));save();openCats()}

/* ---------- análisis de gastos ---------- */
let gaY=null;
function yearStats(y){const rows=S.y[y]||[],o={byCat:{},byRow:[],inc:0,incG:0,cons:0,aho:0,uso:0,paid:0,tot:0,m:Array.from({length:12},()=>({cons:0,incG:0,aho:0,byCat:{}}))};
 rows.forEach(x=>{const c=catOf(x),s=x.a.reduce((a,b)=>a+(b||0),0),pd=x.a.reduce((a,b,i)=>a+(x.p[i]?(b||0):0),0);if(!s)return;
  o.byCat[c.id]=(o.byCat[c.id]||0)+s;o.byRow.push({x,c,s});o.tot+=s;o.paid+=pd;
  x.a.forEach((v,i)=>{v=v||0;const M=o.m[i];if(c.t=='g'){M.cons+=v;M.byCat[c.id]=(M.byCat[c.id]||0)+v}else if(c.t=='i')M.incG+=v;else if(c.t=='a')M.aho+=v});
  if(c.t=='g')o.cons+=s;else if(c.t=='a')o.aho+=s;else if(c.t=='i'){o.inc+=s;o.incG+=s}else if(c.t=='u'){o.inc+=s;o.uso+=s}});
 return o}
const ms=n=>{if(HIDE)return '$ •••';const a=Math.abs(n);return (n<0?'−':'')+'$ '+(a>=1e6?(a/1e6).toFixed(1).replace('.',',')+' M':a>=1e3?Math.round(a/1e3)+' k':Math.round(a))};
function vsPrev(cur,prev){if(!prev)return'';const d=(cur/prev-1)*100;return `<span class="${d>0?'dn':'up'}" title="vs. año anterior">${pct(d)}</span>`}
/* ---------- crédito UVA ---------- */
const LOAN_DEF={name:'Hipotecario BNA UVA',uva0:59225.53,cap0:127462493.14,tna:6,n:360,fee:4,feeY:7,f0:'2026-10-21',first:'2026-12-10',rent:'Alquiler Depto PACHECO',costs:['Credito Hipotecario NACION','Seguros Banco Nación x Credito']};
const loan=()=>{if(!S.loan)S.loan=JSON.parse(JSON.stringify(LOAN_DEF));if(S.loan.fee===undefined){S.loan.fee=4;S.loan.feeY=7}return S.loan};
let LD=null;try{LD=JSON.parse(localStorage.getItem('fin-loan')||'null')}catch(e){}
let LDrun=false;
async function loanFetch(force){if(LDrun)return;if(!force&&LD&&LD.v==2&&Date.now()-LD.ts<20*60e3)return;LDrun=true;
 try{const AD='https://api.argentinadatos.com/v1/',g=u=>fetch(AD+u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});
  const [u,m,bl]=await Promise.all([g('finanzas/indices/uva'),g('cotizaciones/dolares/bolsa'),g('cotizaciones/dolares/blue')]);
  const um={},bm={};u.forEach(x=>um[x.fecha]=x.valor);bl.forEach(x=>bm[x.fecha]=x.compra||x.venta);const past=u.filter(x=>x.fecha<=TODAY);const uh=past[past.length-1];
  const from=addY(TODAY,-5),ser=[];let k=0,lb=null;m.forEach((x,i)=>{if(bm[x.fecha])lb=bm[x.fecha];if(x.fecha<from||!um[x.fecha]||!x.venta)return;if(k++%3==0||i==m.length-1)ser.push([x.fecha,um[x.fecha],x.compra||x.venta,bm[x.fecha]||lb])});
  const lm=m[m.length-1],lbx=bl[bl.length-1];

 const days={'1M':31,'3M':92,'1A':366,'Todo':1e5}[hr],cut=new Date(Date.now()-days*864e5).toISOString().slice(0,10),pts=P.filter(p=>p[0]>=cut);
