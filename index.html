<script>
const MES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MESL=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const SEC={in:'Ingresos',cr:'Créditos',gv:'Gastos varios',sm:'San Matías',ef:'Efectivo',tc:'Tarjetas',iv:'Inversiones',ot:'Otros gastos'};
const SAC={in:'var(--up)',cr:'var(--c12)',gv:'var(--c1)',sm:'var(--c3)',ef:'var(--c6)',tc:'var(--c2)',iv:'var(--c8)',ot:'var(--c4)'};
const $=s=>document.querySelector(s);
const nf=new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});
const money=n=>HIDE?'$ •••••':nf.format(Math.round(n));
const short=n=>{if(HIDE)return '•••';const a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(1).replace('.',',')+'M':a>=1e3?Math.round(n/1e3)+'k':String(Math.round(n))};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='gastos-v1',QK='gastos-q';
const now=new Date();
let S=null,yr=now.getFullYear(),mo=now.getMonth(),tab='mes',dbDoc=null,tm=null,sh=null,mfn=null;
let sec='i',cy=0,cm='all',cr=0,xp={},Q=null,SYNC='wait';
try{const v=localStorage.getItem('gastos-sec');if(v)sec=v;if(!sessionStorage.getItem('fin-opened')){sec='h';sessionStorage.setItem('fin-opened','1')}}catch(e){sec='h'}
const R=()=>S.y[yr];
const TODAY=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})();
const fd=s=>s.slice(8)+'/'+s.slice(5,7)+'/'+s.slice(0,4);
const fds=s=>s.slice(8)+'/'+s.slice(5,7)+'/'+s.slice(2,4);
const nfu=new Intl.NumberFormat('es-AR',{maximumFractionDigits:0});
let HIDE=false;try{HIDE=localStorage.getItem('fin-hide')=='1'}catch(e){}
const MASK='•••••',HV=s=>HIDE?MASK:s;
const usd=n=>'US$ '+(HIDE?MASK:nfu.format(Math.round(n)));
const usd2=n=>HIDE?'US$ '+MASK:'US$ '+n.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const usdS=n=>{if(HIDE)return 'US$ '+MASK;const a=Math.abs(n);return (n<0?'−':'')+(a>=1e6?'US$ '+(a/1e6).toFixed(2).replace('.',',')+'M':a>=1e4?'US$ '+(a/1e3).toFixed(1).replace('.',',')+'k':'US$ '+nfu.format(Math.round(a)))};
const pct=(n,d=1)=>(n>0?'+':n<0?'−':'')+Math.abs(n).toFixed(d).replace('.',',')+'%';
const pc0=n=>n.toFixed(1).replace('.',',')+'%';
const sgn=n=>n>0.0001?'up':n<-0.0001?'dn':'nt';
const none=m=>'<div class="empty">'+m+'</div>';
const hhmm=ms=>{const d=new Date(ms);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function parse(t){t=String(t).replace(/[\s$]/g,'').replace(/^US/,'');if(!t)return 0;if(t.includes(','))t=t.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');const n=parseFloat(t);return isFinite(n)?n:0}

/* ---------- gastos ---------- */
function tot(m,y=yr){let i=0,id=0,e=0,ed=0,pend=0,n=0;for(const x of S.y[y]){const a=x.a[m]||0,d=x.p[m];if(a>0){n++;if(!d)pend++}if(x.s=='in'){i+=a;if(d)id+=a}else{e+=a;if(d)ed+=a}}return{i,id,e,ed,pend,n}}
function bal(m,y=yr){let o=S.o[y]||0,real=o,est=o;for(let k=0;k<=m;k++){const t=tot(k,y);est+=t.i-t.e;real+=t.id-t.ed}return{real,est}}
function ensure(y){if(S.y[y])return;const ks=Object.keys(S.y).map(Number).sort();const pk=S.y[y-1]?y-1:ks[ks.length-1];S.y[y]=(S.y[pk]||[]).filter(x=>x.end==null&&x.rep!==false).map(x=>({s:x.s,n:x.n,a:x.rep?Array(12).fill([...x.a].reverse().find(v=>v)||0):x.a.slice(),p:Array(12).fill(0),...(x.rep?{rep:true}:{})}));S.o[y]=S.y[y-1]?Math.round(bal(11,y-1).est):0}


/* ---------- categorías de gastos e ingresos ---------- */
const CAT_DEF=[{id:'cre',n:'Créditos',t:'g'},{id:'sm352',n:'Mantenimiento San Matías 352',t:'g'},{id:'auto',n:'Auto',t:'g'},{id:'chicos',n:'Chicos: colegio y actividades',t:'g'},{id:'salud',n:'Salud y familia',t:'g'},{id:'tc',n:'Tarjetas',t:'g'},{id:'efe',n:'Efectivo y gastos personales',t:'g'},{id:'aho',n:'Ahorro e inversión',t:'a'},
 {id:'sue',n:'Sueldo',t:'i'},{id:'ren',n:'Renta',t:'i'},{id:'ext',n:'Extraordinarios',t:'i'},{id:'uso',n:'Uso de ahorros',t:'u'}];
const CAT_T={g:'Gasto',a:'Ahorro',i:'Ingreso',u:'Uso de ahorros'};
const CAT_NAME={'Sueldo Gonza':'sue','SAC':'sue','Ingreso Especial':'ext','Dividendo RSU XOM':'ren','Alquiler Depto PACHECO':'ren','Venta Moneda Extranjera':'uso','Rescate COCOS':'uso',
 'Expensas Naudir':'sm352','Celulares':'sm352','Cuota Northfield Mandy':'chicos','Cuota taller de juego Gaspar':'chicos','Deportes Mandy':'chicos','Patente Auto':'auto','OSDIPP Omar y Nancy':'salud','Gastos varios para casa':'sm352'};
const CAT_SEC={in:'ext',cr:'cre',gv:'efe',sm:'sm352',ef:'efe',tc:'tc',iv:'aho',ot:'efe'};
const cats=()=>{if(!S.cats)S.cats=JSON.parse(JSON.stringify(CAT_DEF));return S.cats};
const catById=id=>cats().find(c=>c.id==id);
function catOf(x){const c=(x.c&&catById(x.c))||catById(CAT_NAME[x.n])||catById(CAT_SEC[x.s]);return c||{id:'_',n:'Sin categoría',t:x.s=='in'?'i':'g'}}
const catOk=(c,isIn)=>isIn?(c.t=='i'||c.t=='u'):(c.t=='g'||c.t=='a');
function catColor(c){if(c.t=='a')return'var(--lq)';if(c.t=='u')return'var(--dim)';const L=cats().filter(z=>z.t==c.t);const i=L.findIndex(z=>z.id==c.id);return i<0?'var(--lq)':SER[i%SER.length]}
function catSelect(x,isIn){const cur=x?catOf(x).id:catById(CAT_SEC[sh.k])?CAT_SEC[sh.k]:'';const L=cats().filter(c=>catOk(c,isIn));
 return `<label for="scat">Categoría</label><select class="inp" id="scat">${L.map(c=>`<option value="${c.id}"${c.id==cur?' selected':''}>${esc(c.n)}</option>`).join('')}<option value="__new">+ Nueva categoría…</option></select><input type="text" id="scatn" placeholder="Nombre de la nueva categoría" hidden style="margin-top:8px">`}
document.addEventListener('change',e=>{if(e.target&&e.target.id=='scat'){const n=$('#scatn');if(n){n.hidden=e.target.value!='__new';if(!n.hidden)n.focus()}}});
function applyCat(x,isIn){const sel=$('#scat');if(!sel)return;let id=sel.value;
 if(id=='__new'){const nm=($('#scatn').value||'').trim();if(!nm)return;id='c'+Date.now().toString(36);cats().push({id,n:nm,t:isIn?'i':'g'})}
 x.c=id;Object.keys(S.y).forEach(y=>S.y[y].forEach(r=>{if(r!==x&&r.s==x.s&&r.n==x.n)r.c=id}))}
function openCats(){const L=cats();
 const row=c=>`<div class="catr"><input class="inp" type="text" data-cid="${c.id}" value="${esc(c.n)}" aria-label="Nombre"><span class="pill nt">${CAT_T[c.t]}</span><button class="btn" data-catdel="${c.id}" aria-label="Eliminar ${esc(c.n)}">✕</button></div>`;
 $('#ov').innerHTML=`<div class="ov" data-close="1"><div class="sheet" role="dialog" aria-modal="true" style="max-height:88vh;overflow:auto"><h2>Categorías</h2><div class="m">Renombrá, eliminá o agregá. Al eliminar una, sus conceptos vuelven a la categoría sugerida.</div>
 <div class="lab">Gastos y ahorro</div>${L.filter(c=>c.t=='g'||c.t=='a').map(row).join('')}
 <div class="lab">Ingresos</div>${L.filter(c=>c.t=='i'||c.t=='u').map(row).join('')}
 <div class="lab">Nueva categoría</div><div class="catr"><input class="inp" type="text" id="catnn" placeholder="Nombre"><select class="inp" id="catnt" style="max-width:150px"><option value="g">Gasto</option><option value="a">Ahorro</option><option value="i">Ingreso</option><option value="u">Uso de ahorros</option></select></div>
 <div class="btns"><button data-close="1">Cancelar</button><button class="pr" data-catsave="1">Guardar</button></div></div></div>`}
function saveCats(){const L=cats();document.querySelectorAll('#ov [data-cid]').forEach(i=>{const c=L.find(z=>z.id==i.dataset.cid);if(c&&i.value.trim())c.n=i.value.trim()});
 const nn=($('#catnn').value||'').trim();if(nn)L.push({id:'c'+Date.now().toString(36),n:nn,t:$('#catnt').value});closeSheet();save();render()}
function delCat(id,btn){if(!btn.dataset.arm){btn.dataset.arm=1;btn.textContent='¿Seguro?';return}
 S.cats=cats().filter(c=>c.id!=id);Object.keys(S.y).forEach(y=>S.y[y].forEach(r=>{if(r.c==id)delete r.c}));save();openCats()}

/* ---------- análisis de gastos ---------- */
let gaY=null;
function yearStats(y){const rows=S.y[y]||[],o={byCat:{},byRow:[],inc:0,incG:0,cons:0,aho:0,uso:0,paid:0,tot:0,m:Array.from({length:12},()=>({cons:0,incG:0,aho:0,byCat:{}}))};
 rows.forEach(x=>{const c=catOf(x),s=x.a.reduce((a,b)=>a+(b||0),0),pd=x.a.reduce((a,b,i)=>a+(x.p[i]?(b||0):0),0);if(!s)return;
  o.byCat[c.id]=(o.byCat[c.id]||0)+s;o.byRow.push({x,c,s});o.tot+=s;o.paid+=pd;
  x.a.forEach((v,i)=>{v=v||0;const M=o.m[i];if(c.t=='g'){M.cons+=v;M.byCat[c.id]=(M.byCat[c.id]||0)+v}else if(c.t=='i')M.incG+=v;else if(c.t=='a')M.aho+=v});
  if(c.t=='g')o.cons+=s;else if(c.t=='a')o.aho+=s;else if(c.t=='i'){o.inc+=s;o.incG+=s}else if(c.t=='u'){o.inc+=s;o.uso+=s}});

 tipEl.hidden=false;const w=tipEl.offsetWidth,h=tipEl.offsetHeight;let lx=x+14,ly=y-h-12;if(lx+w>innerWidth-8)lx=x-w-14;if(lx<8)lx=8;if(ly<8)ly=y+16;tipEl.style.left=lx+'px';tipEl.style.top=ly+'px';

const iolF=k=>{const q=IOLQ[k];return q&&q.c!=null&&Date.now()-q.at<4*60e3?q:null};
const qU=k=>{const q=iolF(k);return (q?[q.c,q.ch]:null)||(Q&&Q.usd&&Q.usd[k])||(CAT&&CAT.usd&&CAT.usd[k])||null};
const qA=k=>Q&&((Q.ars&&Q.ars[k])||(Q.px&&Q.px[k]!=null?[Q.px[k],Q.ch&&Q.ch[k]]:null))||null;
const qS=k=>{if(!Q||!Q.us||Q.us[k]==null)return null;return Array.isArray(Q.us[k])?Q.us[k]:[Q.us[k],Q.usch&&Q.usch[k]]};

function pq(h){const m=mepE();
 if(h.pu!=null&&h.mt&&(!Q||!Q.ts||h.mt>Q.ts))return{pu:h.pu,c:null,live:0,man:1};
 let r=h.k=='est'||h.k=='fci'?null:qU(dtk(h));if(r)return{pu:r[0],c:r[1],live:1};
 r=qA(h.t);if(r&&!(Q&&!Q.v))return{pu:r[0]/m,c:r[1],live:1};
 if(h.p!=null)return{pu:h.p/m,c:h.p&&h.pp?(h.p/h.pp-1)*100:null,live:0};
 return{pu:null,c:null,live:0}}

/* modelo de cartera en USD */
function port(){const I=S.inv,m=mepE(),items=[];
 I.pos.forEach((h,i)=>{const e=pq(h),[c,sec,geo]=meta(h),v=e.pu==null?0:h.q*e.pu/h.per,dU=e.c!=null&&e.pu!=null?v-v/(1+e.c/100):0;
  items.push({i,h,t:dtk(h),u:h.t,n:h.n,c,sec,geo,cur:ARS_ASSET[h.t]?'ARS':'USD',v,vA:v*m,ch:e.c,dU,live:e.live,man:e.man,np:e.pu==null,px:e.pu})});
 const fx={ars:1,mep:m,cable:(Q&&Q.ccl)||I.cable||m};
 I.cash.forEach((c,ci)=>{const vA=c.u*fx[c.fx];items.push({i:-1,ci,t:c.fx=='ars'?'ARS':c.fx=='mep'?'USD MEP':'USD CABLE',u:'',n:c.n,c:'lq',sec:'Efectivo',geo:c.fx=='ars'?'Argentina':'Global',cur:c.fx=='ars'?'ARS':'USD',v:vA/m,vA,ch:null,dU:0,live:0,cash:1})});
 const T=items.reduce((a,x)=>a+x.v,0),D=items.reduce((a,x)=>a+x.dU,0);
 const by={};CORD.forEach(k=>by[k]={v:0,d:0,n:0});items.forEach(x=>{const b=by[x.c];b.v+=x.v;b.d+=x.dU;b.n++});
 return{items,T,D,by,m}}

/* ---------- en vivo: APIs públicas de rendimientos.co (BYMA · data912) ---------- */
const API='https://rendimientos.co/api/';
let LIVE={st:'idle',ok:false,err:'',at:0},liveTimer=null;
const J=async p=>{const r=await fetch(API+p,{cache:'no-store'});if(!r.ok)throw new Error(p+' '+r.status);return r.json()};
const isD=(sym,set)=>/D$/.test(sym)&&(set[sym.slice(0,-1)]||set[sym.slice(0,-1)+'C']);
function needKeys(){const I=S&&S.inv,u={},a={},us={XOM:1};if(!I)return{u,a,us};
 I.pos.forEach(h=>{u[dtk(h)]=1;a[h.t]=1});I.est.forEach(e=>e.u.forEach(x=>us[x.tk]=1));return{u,a,us}}
const ds=(a,n)=>{if(!a||a.length<=n)return a||[];const o=[];for(let i=0;i<n;i++)o.push(a[Math.round(i*(a.length-1)/(n-1))]);return o};
async function liveFetch(force){
 if(LIVE.st=='run')return;if(!force&&Date.now()-LIVE.at<45000)return;
 LIVE.st='run';stRender();
 dolFetch().then(()=>{if(S&&sec=='d')render()});
 try{
  const [cot,cedR,onsR,sobR,usaR]=await Promise.all([J('cotizaciones'),J('cedears'),J('ons'),J('soberanos'),J('usa-stocks')]);
  const ced=cedR.data||[],ons=onsR.data||[],sob=sobR.data||[],usa=usaR.data||[];
  const base={};ced.forEach(x=>base[x.symbol]=1);
  const usd={},kk={},ars={};
  ced.forEach(x=>{if(!x.c)return;if(isD(x.symbol,base)){usd[x.symbol]=[x.c,x.pct_change]}else if(!(/C$/.test(x.symbol)&&base[x.symbol.slice(0,-1)]))ars[x.symbol]=[x.c,x.pct_change]});

  sob.forEach(x=>{if(x.price_usd){usd[x.symbol+'D']=[x.price_usd,x.pct_change];kk[x.symbol+'D']='bono'}});
  const nk=needKeys(),usm={};usa.forEach(x=>{if(nk.us[x.symbol]&&x.c)usm[x.symbol]=[x.c,x.pct_change]});

  if(!Q.mep&&S&&S.inv)Q.mep=S.inv.mep;

  LIVE.st='ok';LIVE.ok=true;LIVE.at=ts;LIVE.err='';
  stRender();if(S)render();

  const [w,hot,er]=await Promise.all([J('mundo').then(r=>r.data||[]).catch(()=>null),J('hot-movers').then(r=>r.data||[]).catch(()=>null),Promise.resolve(null)]);
  const earn={};if(er)Object.keys(er).forEach(k=>{if(Array.isArray(er[k]))earn[k]=[...new Set(er[k].slice().sort((p,q)=>(q.marketCap||0)-(p.marketCap||0)).map(x=>x.symbol))].slice(0,8)});
  MON={ts,cot:{ofi:Q.ofi,ofiPrev:cot.oficial&&cot.oficial.prevClose,mep:Q.mep,ccl:Q.ccl,rp:Q.rp},w:(w||(MON&&MON.w)||[]).map(x=>x.sp&&!x.sparkline?x:({id:x.id,n:x.name,g:x.group,p:x.price,pc:x.prevClose,c:x.change,sp:ds(x.sparkline,90)})),hot:hot?hot.map(x=>({s:x.symbol,n:x.name,p:x.price,c:x.change})):(MON&&MON.hot)||[],earn:er?earn:(MON&&MON.earn)||{}};
  persist();

 stRender();if(S)render()}

const LK='fin-lock';const lockAfter=()=>{try{const v=localStorage.getItem('fin-lockafter');return v==null?3*60e3:+v}catch(e){return 3*60e3}};
let LOCKED=false,hiddenAt=0;
const lockCfg=()=>{try{return JSON.parse(localStorage.getItem(LK)||'null')}catch(e){return null}};
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function lockSupported(){try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){return false}}
async function lockEnable(){
 if(!await lockSupported()){toast('Este dispositivo o navegador no permite Face ID / Touch ID para sitios web.');return false}
 try{const em=SESSION&&SESSION.user&&SESSION.user.email||'usuario';
  const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'Finanzas Gonzo',id:location.hostname},user:{id:rnd(16),name:em,displayName:'Finanzas Gonzo · '+em},
   pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000,attestation:'none'}});
  localStorage.setItem(LK,JSON.stringify({id:b64(c.rawId),on:true}));toast('Bloqueo activado en este dispositivo');return true}
 catch(e){toast(e&&e.name=='NotAllowedError'?'Activación cancelada.':'No se pudo activar: '+(e&&e.message||e));return false}}
function lockDisable(){try{localStorage.removeItem(LK)}catch(e){}LOCKED=false;drawLock();toast('Bloqueo desactivado en este dispositivo')}
async function unlock(){const c=lockCfg();if(!c){LOCKED=false;drawLock();return}

 try{await navigator.credentials.get({publicKey:{challenge:rnd(32),rpId:location.hostname,allowCredentials:[{type:'public-key',id:ub64(c.id)}],userVerification:'required',timeout:60000}});
  LOCKED=false;drawLock()}
 catch(e){if(msg)msg.textContent=e&&e.name=='NotAllowedError'?'No se pudo verificar. Probá de nuevo.':'Error: '+(e&&e.message||e)}}
function lockNow(){if(lockCfg()&&SESSION){LOCKED=true;hideTip&&hideTip();closeSheet&&closeSheet();drawLock()}}

 if(!el){el=document.createElement('div');el.id='lock';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','App bloqueada');document.body.appendChild(el)}

/* ---------- personal doméstico: alta, baja, modificación; el mensual de quien está activa va a su concepto en Gastos ---------- */
const WPM=52/12;
const domS=()=>{if(!S.dom)S.dom={row:'Empleada Domestica',emps:[]};return S.dom};
const domRate=(E,k)=>{const R=(E.r||[]).filter(r=>r.f<=k).sort((a,b)=>a.f<b.f?-1:1);return R.length?R[R.length-1]:null};

const domMon=r=>r?r.hd*r.dw*WPM*r.ph+(r.vd||0)*r.dw*WPM:0;
function domAt(k){const D=domS();return D.emps.filter(E=>domAct(E,k)).reduce((a,E)=>a+domMon(domRate(E,k)),0)}
/* el primer valor de la hora siempre arranca en el alta (si se mueve el alta, se mueve con ella) */
function domNorm(e){if(!e||!e.from)return false;e.r=(e.r||[]).slice().sort((a,b)=>a.f<b.f?-1:1);let ch=false;const pre=e.r.filter(x=>x.f<e.from);
 if(pre.length){const keep=pre[pre.length-1],has=e.r.some(x=>x.f==e.from);e.r=e.r.filter(x=>x.f>=e.from);if(!has)e.r.unshift({...keep,f:e.from});ch=true}
 else if(e.r.length&&e.r[0].f>e.from){e.r[0].f=e.from;ch=true}return ch}
function domAuto(){const D=S.dom;if(!D||!D.emps||!D.emps.length||!D.row)return false;let ch=false;D.emps.forEach(e=>{if(domNorm(e))ch=true});const first=D.emps.map(E=>E.from).sort()[0];
 Object.keys(S.y).forEach(y=>{for(let m=0;m<12;m++){const k=ymK(+y,m);if(k<first)continue;const [x,nw]=rowIn(y,D.row,{s:'out',c:'sm'});if(!x)return;if(nw)ch=true;x.dom=1;if(x.p[m])continue;
  const v=Math.round(domAt(k));if((x.a[m]||0)!=v){x.a[m]=v;ch=true}}});return ch}

async function infmFetch(){if(INFM&&Date.now()-INFM.ts<12*36e5)return;try{const a=await fetch('https://api.argentinadatos.com/v1/finanzas/indices/inflacion').then(r=>r.json());const m={};a.forEach(x=>{m[x.fecha.slice(0,7)]=+x.valor});INFM={ts:Date.now(),m};try{localStorage.setItem('fin-infm',JSON.stringify(INFM))}catch(e){}if(sec=='g'&&tab=='dom')render()}catch(e){}}
const infM=k=>INFM&&INFM.m[k]!=null?[INFM.m[k]/100,1]:[infl(),0];
function infAcc(from,to){let f=1,est=0;for(let k=mAdd(from,1);k<=to;k=mAdd(k,1)){const [v,real]=infM(k);f*=1+v;if(!real)est++}return{f,est}}
function domNeed(e){const r=domRate(e,NOWK);if(!r)return null;const A=infAcc(r.f,NOWK),acc=(A.f-1)*100,lvl=acc>=10?['dn','Requiere aumento']:acc>=5?['w','Conviene revisar']:['up','Al día'];
 return{r,acc,est:A.est,lvl,sug:Math.ceil(r.ph*A.f/100)*100,sugV:r.vd?Math.ceil(r.vd*A.f/100)*100:0,months:mDiff(r.f,NOWK)}}
function domChart(){const D=domS();if(!D.emps.length)return'';const first=D.emps.map(e=>e.from).sort()[0],start=mDiff(first,NOWK)>5?mAdd(NOWK,-5):first<NOWK?first:NOWK,end=mAdd(first>NOWK?first:NOWK,6),ks=[];for(let k=start;k<=end;k=mAdd(k,1))ks.push(k);
 const paid=k=>{const y=+k.slice(0,4),m=+k.slice(5,7)-1,x=S.y[y]&&S.y[y].find(z=>z.n==D.row);return x&&x.p[m]?x.a[m]||0:null};
 const pay=ks.map(k=>{const p=paid(k);return p!=null?p:Math.round(domAt(k))});
 // pago "empatado" con la inflación desde el último aumento vigente en cada mes
 const keep=ks.map(k=>{if(k<NOWK)return 0;let v=0;D.emps.filter(e=>domAct(e,k)).forEach(e=>{const r=domRate(e,k);if(r)v+=domMon(r)*infAcc(r.f,k).f});return Math.round(v)});
 const raises=new Set();D.emps.forEach(e=>(e.r||[]).forEach((r,i)=>{if(i||r.f!=e.from)raises.add(r.f)}));
 const W=Math.round(Math.max(300,Math.min(760,(($('#app')||{}).clientWidth||400)-56))),H=128,L=44,Rr=6,T=10,B=20,mx0=Math.max(1,...pay,...keep),tk=ticks(0,mx0),mx=tk[tk.length-1],Y=q=>T+(1-q/mx)*(H-T-B),bw=(W-L-Rr)/ks.length,bW=Math.min(16,bw*.55);
 let s='';tk.forEach(q=>{s+=`<line class="gl" x1="${L}" x2="${W-Rr}" y1="${Y(q)}" y2="${Y(q)}"/><text class="ax" x="${L-8}" y="${Y(q)+3}" text-anchor="end">${short(q)}</text>`});
 ks.forEach((k,i)=>{const cx=L+bw*i+bw/2,v=pay[i],past=k<NOWK,cur=k==NOWK;const tip={t:mFull(k)+(raises.has(k)?' · aumento':''),r:[['var(--c1)',paid(k)!=null?'Pagado':'Estimado',money(v)],['var(--c2)','Para empatar inflación',money(keep[i])]].concat(keep[i]>v&&v?[['','Atraso',pc0((keep[i]/v-1)*100)]]:[])};
  s+=`<g class="bc" data-tip="${tipA(tip)}"><rect class="band" x="${cx-bw/2+1}" y="${T}" width="${bw-2}" height="${H-T-B}" rx="6"/>${v?`<path d="${rtop(cx-bW/2,Y(v),bW,Y(0)-Y(v),4)}" style="fill:var(--c1)" opacity="${past?.55:cur?1:.8}"/>`:''}${raises.has(k)?`<text x="${cx}" y="${Y(v)-5}" text-anchor="middle" style="font:700 10px var(--mono);fill:var(--up)">▲</text>`:''}${i%Math.ceil(ks.length/(W/46))==0||k==NOWK?`<text class="ax" x="${cx}" y="${H-5}" text-anchor="middle"${k==NOWK?' style="font-weight:700"':''}>${mLab(k)}</text>`:''}</g>`});
 const pts=keep.map((v,i)=>v?[L+bw*i+bw/2,Y(v)]:null).filter(Boolean);if(pts.length>1)s+=`<path d="M${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L')}" fill="none" style="stroke:var(--c2)" stroke-width="2" stroke-dasharray="5 4" pointer-events="none"/>`;
 const nx=L+bw*ks.indexOf(NOWK);s+=`<line x1="${nx}" x2="${nx}" y1="${T}" y2="${H-B}" style="stroke:var(--fg)" opacity=".25" stroke-dasharray="2 3"/>`;
 const sv=`<svg class="dch" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%;height:auto" role="img" aria-label="Pagos mensuales al personal doméstico y valor para empatar la inflación">${s}</svg>`;
 const iN=Math.max(0,ks.indexOf(NOWK)),i6=Math.min(ks.length-1,iN+6),gap=pay[i6]?keep[i6]/pay[i6]-1:0;
 return`<div class="chart dchw" style="margin-top:12px"><h3>Pagos mensuales</h3><div class="dsum"><div><small>Este mes</small><b>${pay[iN]?money(pay[iN]):'—'}</b></div><div><small>${mLab(ks[i6])}</small><b>${money(pay[i6])}</b></div><div><small>Atraso en ${mLab(ks[i6])}</small><b class="${gap>=.1?'neg':gap>=.05?'':'pos'}">${gap>0?pc0(gap*100):'—'}</b></div></div>${sv}${legend([['var(--c1)','Pago'],['var(--c2)','Para empatar inflación']])}</div>`}
function domRaise(i,f0){const e=domS().emps[i],last=domRate(e,'9999-12'),f=f0||mAdd(NOWK,1),base=domRate(e,mAdd(f,-1))||last,N=domNeed(e);mfn=null;

 if(SESSION&&lockCfg()){LOCKED=true;drawLock();unlock()}

/* swipe lateral entre submenús del módulo */
(()=>{let sx=0,sy=0,st=0,ok=false;
 const segBtns=()=>{const id=sec=='g'?'#tabs':'#sub',el=$(id);if(!el||el.hidden||el.offsetParent===null)return null;return [...el.querySelectorAll('button')]};
 document.addEventListener('touchstart',e=>{ok=false;if(e.touches.length!=1||LOCKED||!S)return;const tg=e.target;
  if(tg.closest('.hsc,#mch,input,select,textarea,.ov,#lock,#nav,.seg,.sheet'))return;const x=e.touches[0].clientX;if(x<18||x>innerWidth-18)return;
  sx=x;sy=e.touches[0].clientY;st=Date.now();ok=true},{passive:true});
 document.addEventListener('touchend',e=>{if(!ok)return;ok=false;const c=e.changedTouches[0],dx=c.clientX-sx,dy=c.clientY-sy;
  if(Date.now()-st>700||Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.8)return;go(dx<0?1:-1)},{passive:true});
 function go(dir){const B=segBtns();if(!B)return false;const i=B.findIndex(b=>b.classList.contains('on'));const j=i+dir;if(i<0||j<0||j>=B.length)return false;
  hideTip();B[j].click();const a=$('#app');a.classList.remove('sw-l','sw-r');void a.offsetWidth;a.classList.add(dir>0?'sw-l':'sw-r');return true}
 /* trackpad: deslizar con dos dedos hacia los costados */
 let acc=0,lockT=0,rst=null;
 let vT=0;addEventListener('wheel',e=>{if(LOCKED||!S||$('#ov').innerHTML)return;if(e.shiftKey||e.ctrlKey)return;if(Math.abs(e.deltaY)>2){vT=Date.now();acc=0}if(Date.now()-vT<450)return;if(Math.abs(e.deltaX)<Math.abs(e.deltaY)*3+4)return;
  let el=e.target;while(el&&el!==document.body){if(el.scrollWidth>el.clientWidth+2&&/(auto|scroll)/.test(getComputedStyle(el).overflowX))return;el=el.parentElement}
  if(Date.now()<lockT)return;acc+=e.deltaX;clearTimeout(rst);rst=setTimeout(()=>acc=0,180);
  if(Math.abs(acc)>220){const d=acc>0?1:-1;acc=0;lockT=Date.now()+700;go(d)}},{passive:true});
 /* teclado: flechas izquierda / derecha */
 document.addEventListener('keydown',e=>{if(e.key!='ArrowLeft'&&e.key!='ArrowRight'||e.metaKey||e.ctrlKey||e.altKey||LOCKED||!S||$('#ov').innerHTML)return;
  const tg=e.target;if(tg.closest&&tg.closest('input,select,textarea,[contenteditable]'))return;if(go(e.key=='ArrowRight'?1:-1))e.preventDefault()});
 document.addEventListener('animationend',e=>{if(e.target.id=='app')e.target.classList.remove('sw-l','sw-r')});
})();
</script></body></html>
